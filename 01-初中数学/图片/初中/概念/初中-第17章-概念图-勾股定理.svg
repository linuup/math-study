<svg xmlns='http://www.w3.org/2000/svg' width='960' height='540' viewBox='0 0 960 540'>
<rect width='100%' height='100%' fill='#fff'/>
<polygon points='180,430 180,170 520,430' fill='#e0f2fe' stroke='#0284c7' stroke-width='4'/>
<rect x='180' y='390' width='40' height='40' fill='none' stroke='#0284c7' stroke-width='3'/>
<text x='130' y='300' font-size='26' font-family='Microsoft YaHei'>a</text>
<text x='340' y='470' font-size='26' font-family='Microsoft YaHei'>b</text>
<text x='360' y='280' font-size='26' font-family='Microsoft YaHei'>c</text>
<text x='580' y='210' font-size='32' font-family='Microsoft YaHei' fill='#111827'>a² + b² = c²</text>
<text x='580' y='270' font-size='24' font-family='Microsoft YaHei' fill='#334155'>逆定理：若满足该式，则三角形是直角三角形</text>
</svg>
