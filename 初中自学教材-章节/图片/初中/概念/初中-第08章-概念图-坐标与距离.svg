<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <line x1="100" y1="450" x2="860" y2="450" stroke="#111" stroke-width="3"/>
  <line x1="180" y1="500" x2="180" y2="70" stroke="#111" stroke-width="3"/>
  <text x="870" y="458" font-size="22" font-family="Microsoft YaHei">x</text>
  <text x="168" y="62" font-size="22" font-family="Microsoft YaHei">y</text>
  <circle cx="340" cy="330" r="6" fill="#2563eb"/><text x="350" y="332" font-size="22" font-family="Microsoft YaHei">A(2,2)</text>
  <circle cx="580" cy="210" r="6" fill="#dc2626"/><text x="590" y="212" font-size="22" font-family="Microsoft YaHei">B(5,5)</text>
  <line x1="340" y1="330" x2="580" y2="210" stroke="#0ea5e9" stroke-width="3"/>
  <text x="90" y="40" font-size="30" font-family="Microsoft YaHei">平面直角坐标系：先看横坐标x，再看纵坐标y</text>
  <text x="420" y="390" font-size="24" fill="#0f172a" font-family="Microsoft YaHei">AB = √[(x₂-x₁)² + (y₂-y₁)²]</text>
</svg>
